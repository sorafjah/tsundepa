<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ================= 設定（ここの数値だけ直せば調整できます） ================= */
const CFG = {
  version: 'v2026-11-14h',
  table: { half: 1.1, top: 1.2 },      // 台の半分の幅・台の上面の高さ
  grid: 0.25,                           // 置くときに吸いつく間隔
  gravity: -18,
  maxPieces: 60,                        // 制限なしのときの上限（iPadの重さ対策）
  limitPieces: 20,                      // 「20こ」制限
  buildTime: 60,                        // 「60びょう」制限
  limitBalls: 3,                        // 「3かい」制限
  vs: {                                 // 対戦だけの設定（積み方の工夫で差がつくよう、ひとりでより弱い）
    balls: ['ball', 'ball', 'ball'],    // 投げる順番
    ballR: 0.18, ballMass: 4,           // 対戦のボールの大きさ・重さ（細いタワー約15こ・低く広い山約3こ落ちる強さ）
  },
  maxHeight: 6,                         // 台の上にこれ以上は積めない
  pieceDensity: 3.0,                    // パーツの重さ（小さいほど派手に飛ぶ）
  buildDamp: [0.3, 0.6],                // 積むときの動きにくさ（移動・回転）＝崩れにくくする補正
  smashDamp: [0.02, 0.06],              // 壊すときの動きにくさ
  fingerOffset: 0,                      // タッチのとき指の何px上をねらうか（0＝指の真下に出す）
  launcher: { x: 0, y: 1.35, z: 8.4 },  // 玉の置き場所（手前・低め）
  throw: { vMin: 9, vMax: 13, pitchMin: 14, pitchMax: 28, yawMax: 24, pull: 0.3, minPower: 0.12 },
  maxFov: 72,                           // 縦長の画面での視野の上限（度）
  phoneMax: 560,                        // 短い辺がこれより小さい画面はスマホ用の配置
  phoneShift: { port: 0.13, land: 0.08, portThrow: -0.1, landThrow: 0.17 }, // スマホで画面の中心を上にずらす量（積む／投げる）
  tipNudge: 0.6,                        // ▼を置いたときに少し傾ける速さ（支えがないとこける）
  aimDots: 4,                           // ねらいの点線の長さ（1こ＝0.05秒ぶん。4こで出だしだけ）
  ballGravity: -6,                      // 玉だけ重力を弱くして、ゆっくり飛ばす（台まで約0.8〜1秒）
  balls: {
    ball: { r: 0.2,  mass: 5,  name: 'ボール' },
    iron: { r: 0.27, mass: 22, name: 'てっきゅう' },
    bomb: { r: 0.22, mass: 4,  name: 'ばくだん', radius: 2.8, power: 15 },
  },
  settle: { afterHit: 1.2, noHit: 2.6, max: 7 },
  fallBelow: 0.25,                      // 台の上面よりこれだけ下がったら「落ちた」
};

/* ================= 便利関数 ================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const P = [
  { name: 'あかさん', col: '#d93a3f', mark: '●' },
  { name: 'あおさん', col: '#2f6fed', mark: '■' },
];
const pl = i => `<span class="pl" style="background:${P[i].col}">${P[i].mark} ${P[i].name}</span>`;

/* ================= ゲーム状態 ================= */
const G = {
  screen: 'help', view: 'orbit', paused: true, frames: 0, elapsed: 0,
  mode: 'solo', opts: { balls: false, count: false, time: false },
  round: 0, builder: 0, smasher: 0, scores: [0, 0], totals: [0, 0],
  skin: 'blocks', shape: 'cube', ori: { cube: 0, tall: 0, plank: 0, cyl: 0, tri: 0 },
  timeLeft: 0, camAng: 0.6, camAngT: 0.6, autoIdx: 0, snapshot: null,
  total: 0, fallen: 0, ballsLeft: 0, thrown: 0, ballType: 'ball',
  ball: null, ready: false, pulling: false, aim: null, endTimer: 0, perfect: false,
  firstHelp: true, hintDone: false,
};
const pieces = [];
function lim() {
  const vs = G.mode === 'vs';
  return { balls: vs || G.opts.balls, count: vs || G.opts.count, time: !vs && G.opts.time, must: vs };
}
const maxCount = () => lim().count ? CFG.limitPieces : CFG.maxPieces;

/* ================= 音（Web Audio 合成） ================= */
let AC = null, master = null, noiseBuf = null, lastClack = 0;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state !== 'running') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = 0.3, slide = 0, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f0, f1, type = 'bandpass', when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = type;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  tap()   { tone(660, 0.06, 'triangle', 0.2); },
  place() { tone(420, 0.09, 'triangle', 0.3, 260); },
  pop()   { tone(360, 0.12, 'square', 0.12, -200); },
  whoosh(){ noise(0.3, 0.35, 500, 3000); },
  kaan(v, heavy) { const k = clamp(v, 0.4, 1.2);   // 木がはじけるような「ドカッ・ガラッ」
            tone(heavy ? 95 : 150, 0.22, 'sine', 0.9 * k, heavy ? -50 : -80);
            tone(heavy ? 230 : 330, 0.09, 'triangle', 0.5 * k, -150);
            noise(0.18, 0.9 * k, 1400, 250, 'lowpass');
            noise(0.06, 0.5 * k, 900, 500); },
  clack(v){ if (!AC || AC.currentTime - lastClack < 0.045) return; lastClack = AC.currentTime;
            const k = clamp(v / 8, 0.15, 1);
            tone(rnd(260, 900), 0.06, 'triangle', 0.3 * k, -100); noise(0.04, 0.25 * k, 1800, 700); },
  boom()  { noise(0.9, 1.0, 900, 50, 'lowpass'); tone(80, 0.7, 'sine', 0.9, -45); noise(0.2, 0.5, 3000, 800); },
  count() { tone(980, 0.07, 'sine', 0.22); },
  tick()  { tone(1200, 0.05, 'square', 0.1); },
  fanfare(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.3, 0, i * 0.13)); tone(1047, 0.6, 'triangle', 0.3, 0, 0.55); },
  perfect(){ [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, 0.25, 'triangle', 0.3, 0, i * 0.09)); },
  turn()  { tone(587, 0.15, 'triangle', 0.3); tone(880, 0.25, 'triangle', 0.3, 0, 0.15); },
};

/* ================= 描画の準備 ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 220);
const camPos = new THREE.Vector3(4, 4.6, 6), camLook = new THREE.Vector3(0, 2, 0);

function canvasTex(w, h, draw) {

  SFX.boom(); impactFX(1.6); showMsg('ドッカーン！', 1.1);
  ball.hit = true; ball.hitT = 0; ball.done = true;
  world.removeBody(ball.body); ball.mesh.visible = false;
}
function endThrow() {
  const ball = G.ball; if (!ball) return;
  if (!ball.done) world.removeBody(ball.body);
  ball.mesh.visible = false; G.ball = null;
  for (const p of pieces) p.body.wakeUp();
  if (G.fallen >= G.total || G.ballsLeft <= 0) finishSmash(); else loadBall();
}
function finishSmash() {
  if (G.screen !== 'smash') return;
  if (G.ball) { if (!G.ball.done) world.removeBody(G.ball.body); G.ball.mesh.visible = false; G.ball = null; }
  hideBalls(); G.ready = false; G.screen = 'smashEnd'; G.endTimer = 1.3;
  $('smashUI').classList.add('hide'); $('hint').classList.add('hide');
}
function showResult() {
  G.screen = 'result'; sling.visible = false;
  const n = G.fallen, t = G.total, all = n >= t;
  const stars = '★'.repeat(all ? 3 : n >= t * 2 / 3 ? 2 : n >= t / 3 ? 1 : 0) + '☆'.repeat(all ? 0 : n >= t * 2 / 3 ? 1 : n >= t / 3 ? 2 : 3);
  if (all) SFX.perfect(); else SFX.fanfare();
  burst(tmpV.set(0, TB.top + 4, 0), 60, [0xff5a5a, 0xffd84d, 0x5fd068, 0x3b82f6, 0xffffff], 7, 0.2);
  G.scores[G.smasher] = n; G.totals[G.smasher] = t;
  const head = `<div class="score">${n}こ</div><h2>${all ? 'ぜんぶ おとした！ パーフェクト！' : 'おとした！'}</h2><div class="stars">${stars}</div><p>（ぜんぶで ${t}こ）</p>`;
  if (G.mode === 'solo') {
    openPanel(head + `<div class="row"><button class="big" data-act="retry" style="font-size:20px;background:#ffe36e">おなじ つみかたで<br>もういちど</button><button class="big" data-act="new" style="font-size:20px">あたらしく<br>つむ</button><button class="big" data-act="menu" style="font-size:20px;background:#fff">メニューへ</button></div>`);
  } else if (G.round === 0) {
    openPanel(`<p style="font-size:24px">${pl(G.smasher)} は</p>` + head + `<p style="font-size:22px">つぎは ${pl(G.smasher)} が つむ ばん。<br>${pl(G.builder)} は こわす じゅんびを してね</p><button class="big" data-act="next">つぎへ</button>`);
  } else showFinal();
}
function showFinal() {
  const [a, b] = G.scores;
  const box = i => `<div style="border-color:${P[i].col}">${pl(i)}<div class="n">${G.scores[i]}こ</div></div>`;
  let title;
  if (G.mode === 'coop') title = `<h1>ふたりで ${a + b}こ おとした！</h1>`;
  else title = a === b ? `<h1>ひきわけ！ どっちも すごい</h1>` : `<h1>${pl(a > b ? 0 : 1)} の かち！</h1>`;
  openPanel(title + `<div class="vs">${box(0)}${box(1)}</div><div class="row"><button class="big" data-act="new">もういちど</button><button class="big" data-act="menu" style="background:#fff">メニューへ</button></div>`);
}

/* ================= 入力（タッチ・マウス） ================= */
let pid = null, pullStart = null;
canvas.addEventListener('pointerdown', e => {
  audioInit();
  if (G.paused || !overlay.classList.contains('hide') || pid !== null) return;
  pid = e.pointerId; try { canvas.setPointerCapture(pid); } catch (_) {}
  if (G.screen === 'build') { ghostTimer = 0; ghostFromPointer(e); }
  else if (G.screen === 'smash' && G.ready) { G.pulling = true; pullStart = { x: e.clientX, y: e.clientY }; G.aim = { power: 0, yaw: 0 }; }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== pid) return;
  if (G.screen === 'build') ghostFromPointer(e);
  else if (G.pulling) { G.aim = aimFromPull(e.clientX - pullStart.x, e.clientY - pullStart.y); }
});
function pointerEnd(e, cancel) {
  if (e.pointerId !== pid) return; pid = null;
  if (G.screen === 'build') { if (!cancel && ghostState.shown && ghost.visible) placeNow(); ghost.visible = false; ghostState.shown = false; }
  else if (G.pulling) {
    G.pulling = false; const a = G.aim; G.aim = null;
    if (!cancel && a && a.power >= CFG.throw.minPower && G.screen === 'smash' && G.ready) launch(a);
    else showAim();
  }
}
canvas.addEventListener('pointerup', e => pointerEnd(e, false));
canvas.addEventListener('pointercancel', e => pointerEnd(e, true));

// iPad：拡大・スクロールの防止
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300 && !(e.target.closest && e.target.closest('button'))) e.preventDefault(); lastTouch = n; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('#panel') && panel.scrollHeight > panel.clientHeight) return; e.preventDefault(); }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ================= 毎フレームの更新 ================= */
function update(dt) {
  G.frames++; G.elapsed += dt;
  const sdt = dt;
  world.step(1 / 60, sdt, 4);

  if (G.screen === 'menu') G.camAngT += dt * 0.25;

  if (G.screen === 'build') {
    for (let i = pieces.length - 1; i >= 0; i--) if (pieces[i].body.position.y < TB.top - CFG.fallBelow) { removePiece(pieces[i]); SFX.pop(); hud(); }
    for (const p of pieces) if (p.awakeT > 0) { p.awakeT -= dt; p.body.wakeUp(); }
    if (ghostTimer > 0) { ghostTimer -= dt; if (ghostTimer <= 0 && pid === null) { ghost.visible = false; ghostState.shown = false; } }
    if (lim().time) {
      const before = Math.ceil(G.timeLeft); G.timeLeft -= dt; const now = Math.ceil(G.timeLeft);
      if (now !== before) { hud(); if (now <= 10 && now > 0) SFX.tick(); }
      if (G.timeLeft <= 0) { showMsg('じかんぎれ！', 1.2); pid = null; finishBuild(); }
    }
  }

  if (G.screen === 'smash' || G.screen === 'smashEnd') {
    for (const p of pieces) if (!p.fallen && p.body.position.y < TB.top - CFG.fallBelow) {
      p.fallen = true; G.fallen++; SFX.count(); hud(); bumpInfo();
      if (G.fallen >= G.total && !G.perfect) { G.perfect = true; showMsg('ぜんぶ おとした！', 1.6); }
    }
    const ball = G.ball;
    if (ball) {
      ball.t += sdt;
      if (ball.explode && !ball.done) explode(ball);
      if (ball.hit && ball.hitT === 0 && !ball.done) {   // 当たった瞬間
        impactFX(clamp(ball.vel / 10, 0.6, 1.4)); SFX.kaan(ball.vel / 10, ball.type === 'iron'); showMsg('パッカーン！', 1.0);
        tmpV.copy(ball.body.position); burst(tmpV, 22, [0xffffff, 0xffe36e, 0xffa53a], 6);
      }
      if (ball.hit) ball.hitT += Math.max(sdt, 1e-4);
      const calm = pieces.every(p => p.fallen || p.body.sleepState === CANNON.Body.SLEEPING || p.body.velocity.lengthSquared() < 0.09);
      const S = CFG.settle;
      const gone = !ball.done && (ball.body.position.y < -2 || ball.body.position.length() > 60);
      if (ball.t > S.max || gone || (ball.hit && ball.hitT > S.afterHit && calm) || (!ball.hit && ball.t > S.noHit)) endThrow();
    }
    if (G.screen === 'smashEnd') { G.endTimer -= dt; if (G.endTimer <= 0) showResult(); }
  }
  if (G.screen === 'smash' && (G.pulling || G.ready)) showAim();

  // 見た目を物理に合わせる
  for (const p of pieces) {
    syncMesh(p);
    if (p.face) { const want = (p.fallen || p.body.velocity.lengthSquared() > 6) ? p.face.s : p.face.n; if (p.mesh.material[p.face.slot] !== want) p.mesh.material[p.face.slot] = want; }
  }
  if (G.ball && !G.ball.done) { G.ball.mesh.position.copy(G.ball.body.interpolatedPosition); G.ball.mesh.quaternion.copy(G.ball.body.interpolatedQuaternion); }
  ballMeshes.bomb.userData.spark.scale.setScalar(0.7 + 0.5 * Math.sin(G.elapsed * 30));
  // ゴム
  if (sling.visible) {
    const m = ballMeshes[G.ballType], held = G.ready && m.visible, a = bandGeo.attributes.position;
    a.setXYZ(0, L.x - 0.55, L.y + 0.25, L.z); a.setXYZ(2, L.x + 0.55, L.y + 0.25, L.z);
    if (held) a.setXYZ(1, m.position.x, m.position.y, m.position.z); else a.setXYZ(1, L.x, L.y + 0.25, L.z);
    a.needsUpdate = true;
  }
  // かけら・ばくはつ
  for (const p of parts) if (p.life > 0) {
    p.life -= sdt; p.v.y += CFG.gravity * 0.6 * sdt; p.m.position.addScaledVector(p.v, sdt);
    p.m.rotation.x += 9 * sdt; p.m.rotation.y += 7 * sdt;
    if (p.life <= 0 || p.m.position.y < 0) { p.life = 0; p.m.visible = false; }
  }
  if (fx.flash > 0) { fx.flash -= dt * 2.2; const k = 1 - fx.flash; flash.scale.setScalar(0.4 + k * CFG.balls.bomb.radius); flash.material.opacity = Math.max(0, fx.flash) * 0.8; if (fx.flash <= 0) flash.visible = false; }
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').classList.remove('on'); }

  // カメラ
  const k = Number.isFinite(G.camK) ? G.camK : 1, e = 1 - Math.exp(-5 * dt);
  G.camAng = lerp(G.camAng, G.camAngT, 1 - Math.exp(-7 * dt));
  applyShift();
  if (G.view === 'orbit') { tmpV.set(Math.sin(G.camAng) * 7 * k, 4.6, Math.cos(G.camAng) * 7 * k); camLook.lerp(new THREE.Vector3(0, 2.0, 0), e); }
  else { tmpV.set(0, 2.4, 11.5 * Math.min(k, 1.15));   // 投げるときは縦長でもカメラを下げすぎない（玉と山が小さくならないように）
 camLook.lerp(new THREE.Vector3(0, 1.7, 0), e); }
  camPos.lerp(tmpV, e);
  if (!Number.isFinite(camPos.x + camPos.y + camPos.z)) camPos.copy(tmpV);       // 念のため：おかしな値になったら目標位置に戻す
  if (!Number.isFinite(camLook.x + camLook.y + camLook.z)) camLook.set(0, 1.8, 0);
  camera.position.copy(camPos);
  if (fx.shake > 0.002) { camera.position.x += rnd(-1, 1) * fx.shake; camera.position.y += rnd(-1, 1) * fx.shake; fx.shake *= Math.exp(-7 * dt); }
  camera.lookAt(camLook);
}

function resize() {
  // 表示枠が0の大きさのときに縦横比が計算できず（0÷0）、カメラが二度と戻らなくなるのを防ぐ
  const w = innerWidth, h = innerHeight;
  if (!(w > 0 && h > 0)) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // 縦長の画面では、まず視野を広げ（最大 maxFov 度）、足りないぶんだけカメラを下げる
  const need = Math.tan(25 * Math.PI / 180) * 1.25;
  camera.fov = camera.aspect >= 1.25 ? 50 : Math.min(CFG.maxFov, 2 * Math.atan(need / camera.aspect) * 180 / Math.PI);
  G.camK = Math.max(1, need / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect));
  if (Math.min(w, h) < CFG.phoneMax && h > w) G.camK *= 0.85;   // スマホ縦持ちは少し寄せる
  // スマホ判定：短い辺が560px未満ならスマホ用の配置にする（縦持ち・横持ちで別の配置）
  G.phone = Math.min(w, h) < CFG.phoneMax; G.port = h > w;
  document.body.classList.toggle('phone', G.phone);
  document.body.classList.toggle('port', G.phone && G.port);
  document.body.classList.toggle('land', G.phone && !G.port);
  G.shiftKey = '';
  applyShift();
}
// 下のボタンに隠れないよう、見える中心を上にずらす（スマホのときだけ。積むときと投げるときで量を変える）
function applyShift() {
  const S = CFG.phoneShift, thr = G.view === 'throw';
  const shift = !G.phone ? 0 : G.port ? (thr ? S.portThrow : S.port) : (thr ? S.landThrow : S.land);
  const key = shift + ':' + innerWidth + 'x' + innerHeight;
  if (key === G.shiftKey) return; G.shiftKey = key;
  if (shift) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * shift, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;   // 120Hzでも同じ速さ
  if (!G.paused && dt > 0) update(dt);
  renderer.render(scene, camera);
}

/* ================= テスト用フック =================
   パーツは cannon-es の body.position で動かし、mesh は body.interpolatedPosition を写しています。
   判定に使うときは pieces[i].body.position を見てください。 */
window.__game = {
  state: G, pieces, camera, world, CFG,
  api: {
    tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
    getState() { return { screen: G.screen, mode: G.mode, round: G.round, pieces: pieces.length, total: G.total, fallen: G.fallen, ballsLeft: G.ballsLeft, ready: G.ready, scores: G.scores.slice(), frames: G.frames, elapsed: G.elapsed, ballType: G.ballType, maxY: pieces.reduce((m, p) => Math.max(m, p.body.position.y), 0) }; },
    start(mode = 'solo', opts = {}) { G.paused = false; G.firstHelp = false; G.mode = mode; Object.assign(G.opts, opts); startGame(); },
    select(shape, skin, ori = 0) { G.shape = shape; if (skin) G.skin = skin; G.ori[shape] = ori; renderTray(); makeGhost(); },
    place(x, z) { placeGhostAt(x, z); const p = placeNow(); ghost.visible = false; return !!p; },
    auto(i = 0) { applyPreset(i); hud(); },
    done() { finishBuild(); },
    ok() { const b = panel.querySelector('.big'); if (b) b.click(); },
    act(a) { const b = panel.querySelector(`[data-act="${a}"]`); if (b) b.click(); },
    setBall(t) { G.ballType = t; loadBall(); },
    throwBall(power = 0.6, yawDeg = 0) { if (!G.ready) return false; launch({ power, yaw: yawDeg * Math.PI / 180 }); return true; },
    endSmash() { finishSmash(); },
  },
};

/* ================= 起動 ================= */
$('ver').textContent = CFG.version;
applyPreset(0);
update(1 / 60);
showHelp();
hud();
requestAnimationFrame(frame);
</script>
</body>
</html>
